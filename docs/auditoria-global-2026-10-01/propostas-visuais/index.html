<div class="presentation"><div class="presentation-top"><strong>PR 232 · Propostas para o desktop</strong><span>PROPOSTA · DADOS FICTÍCIOS · PORTAL WEB FORA DO ESCOPO</span></div><nav class="switcher" aria-label="Telas da proposta"></nav></div>

<script src="desktop-atendimento.js"></script>
<script>
const screens=[["geral", "01 · Visão geral"], ["documentos", "02 · Documentos"], ["paciente", "03 · Ficha do paciente"], ["faturamento", "04 · Faturamento"], ["comunicacao", "05 · Comunicação"], ["novoatendimento", "06 · Novo atendimento"], ["atendimento", "07 · Sessão clínica"], ["conclusao", "08 · Conclusão"], ["cobertura", "09 · Cobertura"]];
let page=new URLSearchParams(location.search).get('tela')||'geral';if(!screens.some(x=>x[0]===page))page='geral';
const saved=JSON.parse(sessionStorage.getItem('pr232-demo')||'{}');let signed=saved.signed||false,manual=saved.manual||false,opened=saved.opened||false;let message=saved.message||'Olá, Marina! Aqui é a Ana, da Clínica SemDor. Podemos conversar sobre o seu próximo acompanhamento?';const $=x=>document.querySelector(x);function save(){sessionStorage.setItem('pr232-demo',JSON.stringify({signed,manual,opened,message}));}function escapeHtml(t){return t.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');}
const badge=(text,type='blue')=>`<span class="badge ${type}"><i class="dot"></i>${text}</span>`;
const go=(id)=>location.href='?tela='+id;
const button=(text,fn,cls='')=>`<button class="${cls}" onclick="${fn}">${text}</button>`;
const navItems=[['◷','Meu trabalho','geral'],['♧','Pacientes','paciente'],['＋','Atendimento','atendimento'],['↙','Recebimentos','paciente'],['▤','Faturamento','faturamento'],['▥','Financeiro','faturamento'],['☏','Relacionamento','comunicacao'],['▦','Gestão','geral']];
function header(product='Gerente',who='Ana · gestão'){return `<header class="appbar"><img class="logo" src="logo.png" alt="Clínica SemDor"><span class="product">${product}</span><div class="search">⌕ &nbsp; Buscar paciente ou tarefa</div><div class="account"><span class="avatar">AS</span><span>${who}<br><small>Ambiente de demonstração</small></span></div></header>`}
function sidebar(active,product){const allowed=product==='Consultório'?['Meu trabalho','Pacientes','Atendimento']:product==='Recepção'?['Meu trabalho','Pacientes','Atendimento','Recebimentos','Relacionamento']:product==='Faturamento'?['Meu trabalho','Pacientes','Faturamento']:product==='Central de relacionamento'?['Meu trabalho','Pacientes','Relacionamento']:navItems.map(x=>x[1]);return `<aside class="sidebar"><div class="navlabel">TRABALHO DA EQUIPE</div>${navItems.filter(x=>allowed.includes(x[1])).map(([i,n,p])=>`<a href="?tela=${n==='Atendimento'&&product==='Recepção'?'novoatendimento':p}" class="${n===active?'active':''}"><span class="navicon">${i}</span>${n}</a>`).join('')}<div class="bottom"><a style="${product!=='Gerente'?'display:none':''}" href="#" onclick="modal('Administração','Equipe, acessos, catálogos e integrações ficam agrupados aqui, conforme as permissões do perfil.');return false">⚙ &nbsp; Administração</a><a href="#" onclick="modal('Ajuda por tarefa','A ajuda abre no contexto da tarefa atual, com o próximo passo e orientação de recuperação.');return false">ⓘ &nbsp; Ajuda</a><small style="display:block;margin:12px">Acessos do perfil ${product}</small></div></aside>`}
function shell(content,active='Meu trabalho',product='Gerente',who='Ana · gestão'){return header(product,who)+`<div class="body">${sidebar(active,product)}<main class="main">${content}</main></div>`}
function stat(label,n,foot,color=''){return `<div class="stat"><small>${label}</small><strong style="${color?'color:'+color:''}">${n}</strong><small>${foot}</small></div>`}
function head(title,desc,act=''){return `<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div>${act}</div>`}
function home(){return shell(`<div class="crumb">Gerente <span>/</span> Meu trabalho</div>${head('Bom dia, Ana.','Quinta-feira, 1º de outubro · Priorize o que precisa da equipe.',`<span class="tag">Hoje · 01/10/2026</span>`)}
<div class="stats">${stat('AGENDA DE HOJE','24','18 concluídos · 6 a atender')}${stat('DOCUMENTOS','3','Aguardam assinatura', 'var(--blue)')}${stat('FATURAMENTO','2','Guias sem resposta', 'var(--amber)')}${stat('RELACIONAMENTO','4','Contatos para hoje')}</div>
<div class="grid2"><section class="panel"><div class="panel-head"><h2>O que precisa de atenção</h2><span class="badge blue">3 próximos passos</span></div>
<div class="task"><div class="row"><div class="square">▤</div><div><h3>Concluir assinatura do documento</h3><p>Marina Alves · DOC-2026/0042 · já emitido</p></div></div>${button('Abrir documento',"go('documentos')",'small primary')}</div>
<div class="task"><div class="row"><div class="square">↳</div><div><h3>Conferir retorno incompleto</h3><p>Lote LT-1048 · 2 guias ainda sem resposta</p></div></div>${button('Ver as 2 guias',"go('faturamento')",'small')}</div>
<div class="task"><div class="row"><div class="square">☏</div><div><h3>Retomar contato da campanha</h3><p>WhatsApp aberto · envio ainda não confirmado</p></div></div>${button('Retomar contato',"go('comunicacao')",'small')}</div>
<div class="footerline">Cada ação abre o registro certo e conserva os filtros da origem.</div></section>
<section class="panel"><div class="panel-head"><h2>Continue de onde parou</h2></div><div class="notice"><strong>Marina Alves · ficha do paciente</strong>Documentos, atendimentos e recebimentos no mesmo contexto.</div><div class="spacer"></div>${button('Abrir ficha da Marina',"go('paciente')",'widebutton')}
<div class="spacer"></div><h3>Acessos da sua rotina</h3><div class="listline between"><span>Atendimento no Consultório</span><a href="?tela=atendimento">Abrir →</a></div><div class="listline between"><span>Retornos e campanhas</span><a href="?tela=comunicacao">Abrir →</a></div><div class="footerline">O menu se adapta ao aplicativo e às permissões de cada pessoa.</div></section></div>
<div class="spacer"></div><div class="notice"><strong>Uma entrada clara para cada assunto</strong>Pacientes para a ficha. Faturamento para guias e convênios. Relacionamento para contatos e retornos.</div>`)}
function documents(){return shell(`<div class="crumb">Pacientes <span>/</span> Marina Alves <span>/</span> Documentos</div>${head('Documento emitido nº 0042','Declaração de comparecimento · 01/10/2026, às 09:42',button('← Voltar à ficha',"go('paciente')"))}<div class="notice success"><strong>✓ Documento salvo na ficha da paciente</strong>Você pode imprimir agora e retomar a assinatura deste mesmo documento depois.</div>
<div class="document-grid"><div class="paper-wrap"><div class="paper"><img src="logo.png" alt="SemDor"><div style="float:right;font-size:10px;color:#8490a2">DOC-2026/0042</div><h3>DECLARAÇÃO DE COMPARECIMENTO</h3><p>Declaramos, para fins de demonstração, o comparecimento de <b>Marina Alves</b> à Clínica SemDor em 01 de outubro de 2026, das 09h00 às 09h40.</p><p style="margin-top:20px">Macaé, 01 de outubro de 2026.</p><div class="signature">Dra. Ana Souza<br><span class="muted">Profissional fictícia</span></div><p style="text-align:center;font-size:10px;color:#9aa5b5">EXEMPLO VISUAL · SEM VALIDADE</p></div><small style="display:block;text-align:center;margin-top:12px">Prévia do documento já emitido · 1 página</small></div>
<section class="panel"><div class="detail"><div><small>Paciente</small><b>Marina Alves</b></div><div><small>Documento</small><b>DOC-2026/0042</b></div><div><small>Emissão</small>${badge('Salvo','green')}</div><div><small>Assinatura profissional</small><span id="sign-state">${badge(signed?'Assinada':'Pendente',signed?'green':'amber')}</span></div></div><div class="spacer"></div><h2>O que deseja fazer agora?</h2><div class="actions">${button('▤ &nbsp; Imprimir',"printDemo()",'primary')}${button('Assinar este documento',"signDemo()")}${button('Baixar PDF',"modal('Baixar este documento','A proposta baixa o PDF já emitido, com o mesmo número. Neste protótipo não há download de documento clínico.')")}</div><div class="spacer"></div><div class="notice warn"><strong>Precisa assinar depois?</strong>Feche esta tela e retome pela ficha. O documento já está salvo; sua emissão não será repetida.</div><div class="spacer"></div><div class="between"><small>Próxima ação</small><span class="badge">Imprimir ou assinar</span></div><div class="footerline">Impressão e assinatura são ações independentes. Abrir a prévia não confirma impressão.</div></section></div>`, 'Pacientes','Consultório','Dra. Ana · médica')}
function patient(){return shell(`<div class="crumb">Pacientes <span>/</span> Ficha de Marina Alves</div><div class="heading"><div class="patient"><span class="avatar">MA</span><div><h1>Marina Alves</h1><div class="subinfo">Paciente fictícia · Cadastro 00128 · Convênio de demonstração</div></div></div>${button('Editar cadastro',"modal('Editar cadastro','A ficha permanece no mesmo contexto. Salvar e cancelar ficam explícitos, sem depender de outra janela.')")}</div>
<div class="tabs">${['Resumo','Atendimentos','Documentos','Autorizações','Recebimentos'].map(n=>`<button class="${n==='Documentos'?'active':''}" onclick="${n==='Recebimentos'?"receiptDemo()":n==='Documentos'?"go('paciente')":`modal('${n}','A proposta mantém ${n.toLowerCase()} em um único nível de abas dentro da ficha da paciente.')`}">${n}</button>`).join('')}</div>

function communication(){return shell(`<div class="crumb">Gerente <span>/</span> Relacionamento <span>/</span> Campanhas</div>${head('Um contato, um próximo passo','Campanha de acompanhamento · 4 contatos para hoje',`<span class="tag">Responsável: Ana</span>`)}

const captions={"geral": ["A08–A14 · A20–A25", "Navegação por tarefa e pendências com destino exato. Exemplo do Gerente; cada perfil recebe seu recorte."], "documentos": ["A01–A04 · A14", "Um resultado persistente após emitir. Imprimir, assinar e baixar o mesmo documento, sem nova emissão."], "paciente": ["A05–A07 · A40–A41", "Ficha com um nível de abas, ações visíveis e recibo ligado ao recebimento correto."], "faturamento": ["A32 · A64–A66", "Ausência de resposta continua pendente. Original arquivado e nova versão do XML são ações distintas."], "comunicacao": ["A25 · A31 · A38", "Preparar, abrir, confirmar envio e acompanhar entrega têm estados separados."], "novoatendimento": ["A20 · A24 · fluxo existente da Recepção", "Lançamento administrativo no desktop, com paciente, horário e consequências antes da confirmação."], "atendimento": ["A20 · A24 · fluxo existente do Consultório", "Evolução em campo livre amplo. O botão explicita que salvar também conclui a sessão médica e gera as guias aplicáveis."], "conclusao": ["A01–A04 · A24 · padrão de retomada", "Resultado da sessão separado de impressão e assinatura. Retomar ações sem repetir a conclusão."], "cobertura": ["Inventário da PR 232 · limite definido pelo proprietário", "Oito exemplos de desktop; demais áreas identificadas como ainda não desenhadas. Portal web preservado."]};
const scopes={"geral": ["DESKTOP", "Gerente → Meu trabalho", "Aplicativo instalado no Windows"], "documentos": ["DESKTOP", "Consultório → Emissão de documentos", "Fluxo compartilhado, conforme permissões"], "paciente": ["DESKTOP", "Recepção / módulo clínico → Ficha do paciente", "Aplicativo instalado no Windows"], "faturamento": ["DESKTOP", "Faturamento → Lotes e retornos TISS", "Aplicativo instalado no Windows"], "comunicacao": ["DESKTOP", "Gerente → Campanhas / relacionamento", "Abrir WhatsApp não confirma envio"], "novoatendimento": ["DESKTOP", "Recepção → Lançar atendimento", "Registro administrativo"], "atendimento": ["DESKTOP", "Consultório → Atendimento → Sessão de hoje", "Evolução e conclusão médica"], "conclusao": ["DESKTOP", "Consultório → Resultado da sessão", "Documentos com estados próprios"], "cobertura": ["ESCOPO", "Somente desktop nesta rodada", "Portal web preservado"]};
function render(){ const scope=scopes[page];$('#scope').innerHTML=`<b>${scope[0]}</b><span>${scope[1]}</span><small>${scope[2]}</small>`; $('.switcher').innerHTML=screens.map(([id,n])=>`<a href="?tela=${id}" class="${id===page?'selected':''}">${n}</a>`).join('');$('#app').innerHTML=({geral:home,documentos:documents,paciente:patient,faturamento:billing,comunicacao:communication,novoatendimento:newAttendance,atendimento:consultation,conclusao:clinicalDone,cobertura:coverage})[page]();$('#caption').innerHTML=`<b>O QUE MUDA</b><span>${captions[page][1]}<br><small>Referências da auditoria: ${captions[page][0]} · Proposta de interface; regras e integrações reais dependem de implementação.</small></span>`;}
function modal(title,text,action='Entendi',fn=null){$('#dialog-title').textContent=title;$('#dialog-text').textContent=text;$('#dialog-action').textContent=action;$('#dialog-action').onclick=()=>{$('#dialog').close();if(fn)fn()};$('#dialog').showModal()}
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hide');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hide'),4500)}
function printDemo(){modal('Imprimir DOC-2026/0042','A prévia de impressão abre a via já emitida. Se a impressora falhar, este documento continua salvo e a ação pode ser retomada. Esta demonstração não envia nada à impressora.','Simular falha',()=>modal('Documento salvo · impressão não concluída','DOC-2026/0042 continua na ficha. Confira a impressora e tente imprimir este mesmo documento novamente. Não é necessário emitir outro.','Tentar impressão novamente',()=>toast('Demonstração: retomada de DOC-2026/0042, mantendo o mesmo número.')))}

render();
