/* ===== telas/conversas.css (proposta) ===== */
/* Estilo PRÓPRIO da tela "WhatsApp da clínica" nativa (proposta, out/2026 —
   docs/whatsapp-nativo-na-recepcao.md). Só tokens, como manda docs/telas-blazor.md.
   No app este arquivo moraria em Ativos/css/telas/conversas.css.

   ⚠️ Toda classe leva o prefixo da tela (wa-): "entrada", "saida" e "dica" já são do comum
   (a tela de entrada em moldura.css, o tooltip do gráfico em clinica.css) e colidiram na
   primeira versão deste mockup. Lição em docs/agentes/convencoes.md.

   O WhatsApp reconhecível, nos tokens da casa: lista à esquerda, balões sobre um "papel de
   parede" discreto, ticks de entrega, e o verde SÓ no que é do canal (o selo do canal, o
   balão enviado, o "conectado"). Ação primária continua no acento do app. */

/* ---------- A tela ocupa o palco inteiro; quem rola é cada coluna ---------- */
.pagina.wa{height:100%;max-width:none;padding:0;gap:0;display:grid;grid-template-columns:340px minmax(0,1fr) 320px;
  grid-template-areas:"lista conversa ficha";background:var(--superficie);position:relative;overflow:hidden}
.wa-lista,.wa-conversa,.wa-ficha{display:flex;flex-direction:column;min-height:0;min-width:0}
.wa-lista{grid-area:lista;border-right:1px solid var(--borda)}
.wa-conversa{grid-area:conversa;background:var(--fundo);position:relative}
.wa-ficha{grid-area:ficha;border-left:1px solid var(--borda);background:var(--cinza-50)}

/* O caret, a seleção e as barras de rolagem também são da casa. */
.wa{caret-color:var(--acento);scrollbar-color:var(--cinza-300) transparent;scrollbar-width:thin}
.wa ::selection{background:var(--acento-tint)}
.wa *::-webkit-scrollbar{width:8px;height:8px}
.wa *::-webkit-scrollbar-thumb{background:var(--cinza-300);border-radius:var(--radius-pilula)}
.wa *::-webkit-scrollbar-track{background:transparent}

/* ---------- Avatares: um tom por pessoa, estável ---------- */
.wa .avatar{position:relative;flex:none;font-weight:700}
.wa .avatar.tom-azul{background:var(--azul-100);color:var(--azul-700)}
.wa .avatar.tom-teal{background:var(--teal-50);color:var(--teal-600)}
.wa .avatar.tom-violeta{background:var(--violeta-50);color:var(--violeta-600)}
.wa .avatar.tom-rosa{background:var(--rosa-50);color:var(--rosa-600)}
.wa .avatar.tom-ciano{background:var(--ciano-100);color:var(--ciano-700)}
.wa .avatar.tom-laranja{background:var(--laranja-100);color:var(--laranja-700)}
.wa .avatar.tom-cinza{background:var(--cinza-100);color:var(--cinza-700)}
.wa-canal{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;
  background:var(--sucesso);color:var(--texto-invertido);border:2px solid var(--superficie)}
.wa-canal.sms{background:var(--cinza-500)}
.wa-canal svg{width:9px;height:9px}

/* ---------- Coluna 1: a lista — dois modos: Conversas e Retenção (o Acompanhamento, de onde se escreve) ---------- */
.sr-so{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);margin:-1px}
.wa-modo{flex:1;min-width:0}
.wa-modo button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 10px;font-weight:600}
.wa-modo button b{font-weight:700;font-variant-numeric:tabular-nums;min-width:18px;height:18px;padding:0 5px;border-radius:var(--radius-pilula);
  background:var(--acento-suave);color:var(--acento);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.wa-modo button[aria-pressed="true"] b{background:rgba(255,255,255,.22);color:var(--texto-invertido)}
.wa-resumo{padding:0 var(--space-4) var(--space-2);font-size:var(--text-small-size);color:var(--texto-secundario);line-height:1.4}
.wa-resumo b{color:var(--texto-primario)}
.wa-grupo{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);padding:6px var(--space-4);
  background:var(--cinza-50);border-bottom:1px solid var(--borda);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:var(--text-secao-tracking);color:var(--texto-secundario)}
.wa-grupo span{font-variant-numeric:tabular-nums}
.wa-dias{font-size:var(--text-small-size);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.wa-dias.tom-perigo{color:var(--erro-texto)}
.wa-dias.tom-aviso{color:var(--aviso-texto)}
.wa-dias.tom-neutro{color:var(--texto-secundario)}
.wa-dias.tom-sucesso{color:var(--sucesso-forte)}
.wa-linha-tratamento{font-size:var(--text-table-size);color:var(--texto-secundario);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wa-linha-tratamento b{color:var(--texto-primario);font-weight:600}

/* ---------- Coluna 1: a lista (comum aos dois modos) ---------- */
.wa-lista-topo{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-3) var(--space-2) var(--space-4)}
.wa-lista-topo h1{font-size:var(--text-h3-size);font-weight:var(--text-h3-weight);margin:0;flex:1;min-width:0;display:flex;align-items:baseline;gap:var(--space-2)}
.wa-lista-topo h1 small{font-size:var(--text-small-size);font-weight:500;color:var(--texto-secundario)}
.wa-filtros{display:flex;flex-direction:column;gap:var(--space-2);padding:0 var(--space-3) var(--space-2)}
.wa-filtros .segmentado{align-self:stretch}
.wa-filtros .segmentado button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:5px 8px;font-size:var(--text-table-size)}
.wa-filtros .segmentado button b{font-weight:700;font-variant-numeric:tabular-nums}
.wa-filtros .segmentado button[aria-pressed="true"] b{color:var(--texto-invertido)}
.wa-filtros-linha{display:flex;align-items:center;gap:var(--space-2)}
.wa-filtros-linha .busca{flex:1;min-width:0}
.wa-filtros-linha .busca .campo{height:34px;min-height:34px;border-radius:var(--radius-pilula)}
.wa-filtros-linha .chip{height:34px}
.wa-linhas{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--borda)}
.wa-linha{display:grid;grid-template-columns:44px minmax(0,1fr);gap:var(--space-3);width:100%;padding:var(--space-3) var(--space-3) var(--space-3) var(--space-4);
  border:0;border-bottom:1px solid var(--cinza-100);background:transparent;text-align:left;font:inherit;color:var(--texto-primario);cursor:pointer;
  transition:background var(--duracao-rapida)}
.wa-linha:hover{background:var(--fundo)}
.wa-linha:focus-visible{outline:2px solid var(--foco);outline-offset:-2px}
.wa-linha[aria-current="true"]{background:var(--acento-suave)}
.wa-linha .avatar{width:44px;height:44px;font-size:14px}
.wa-linha-corpo{display:flex;flex-direction:column;gap:2px;min-width:0}
.wa-linha-topo{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2)}
.wa-linha-nome{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wa-linha-hora{font-size:var(--text-small-size);color:var(--texto-secundario);white-space:nowrap;font-variant-numeric:tabular-nums}
.wa-linha.nao-lida .wa-linha-hora{color:var(--sucesso-forte);font-weight:600}
.wa-linha-previa{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-table-size);color:var(--texto-secundario);min-height:20px}
.wa-linha-previa .wa-tick{flex:none}
.wa-linha-previa span.texto{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wa-linha.nao-lida .wa-linha-previa span.texto{color:var(--texto-primario);font-weight:500}
.wa-nao-lidas{min-width:20px;height:20px;padding:0 6px;border-radius:var(--radius-pilula);background:var(--sucesso);color:var(--texto-invertido);
  font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.wa-linha-rodape{display:flex;align-items:center;gap:var(--space-2);margin-top:2px;min-height:18px}
.wa-linha-rodape .selo{margin-left:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wa-linha-quem{font-size:var(--text-small-size);color:var(--texto-secundario);margin-left:auto;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.wa-linha-quem.minha{color:var(--acento);font-weight:600}
.wa-lista-rodape{padding:var(--space-2) var(--space-4);border-top:1px solid var(--borda);font-size:var(--text-small-size);color:var(--texto-secundario);
  display:flex;align-items:center;gap:var(--space-2)}
.wa-ponto{width:8px;height:8px;border-radius:50%;background:var(--sucesso);flex:none}
.wa-ponto.fora{background:var(--erro)}
.wa-linhas .vazio-estado{padding:var(--space-10) var(--space-4)}

/* ---------- Coluna 2: a conversa ---------- */
.wa-cab{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3) var(--space-2) var(--space-4);min-height:64px;
  background:var(--superficie);border-bottom:1px solid var(--borda)}
.wa-cab .avatar{width:40px;height:40px;font-size:13px}
.wa-cab-quem{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.wa-cab-quem h2{margin:0;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:var(--space-2)}
.wa-cab-meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px var(--space-2);font-size:var(--text-small-size);color:var(--texto-secundario)}
.wa-cab-meta .selo{margin-left:0}
.wa-cab-meta button.selo{border:0;cursor:pointer;font:inherit;font-size:11px;font-weight:600}
.wa-cab-meta button.selo:hover{text-decoration:underline}
.wa-cab-acoes{display:flex;align-items:center;gap:var(--space-1);flex:none}
.wa-cab-acoes .botao{height:34px}
.wa-cab-acoes .botao.icone{width:34px}
.wa-faixa{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1) var(--space-3);padding:6px var(--space-4);
  background:var(--superficie);border-bottom:1px solid var(--borda);font-size:var(--text-small-size);color:var(--texto-secundario)}
.wa-faixa .selo{margin-left:0;display:inline-flex;align-items:center;gap:4px}
.wa-faixa .selo svg{width:11px;height:11px}
.wa-faixa i{width:1px;height:12px;background:var(--borda)}
.wa-busca-conversa{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);background:var(--superficie);border-bottom:1px solid var(--borda)}
.wa-busca-conversa .busca{flex:1}
.wa-busca-conversa .busca .campo{height:34px;min-height:34px}
.wa-busca-conversa small{color:var(--texto-secundario);white-space:nowrap}

/* O papel de parede: pontos da cor da borda, bem apagados — WhatsApp reconhecível sem imagem. */
.wa-mensagens{flex:1;min-height:0;overflow-y:auto;padding:var(--space-4) var(--space-6);display:flex;flex-direction:column;gap:2px;
  background-color:var(--fundo);
  background-image:radial-gradient(var(--cinza-200) 1px,transparent 1px);background-size:var(--space-6) var(--space-6)}
.wa-dia{align-self:center;font-size:var(--text-small-size);font-weight:600;color:var(--texto-secundario);padding:3px 10px;margin:var(--space-3) 0 var(--space-2);
  border-radius:var(--radius-pilula);background:var(--superficie);box-shadow:var(--sombra-cartao);border:1px solid var(--borda)}
.wa-evento{align-self:center;display:inline-flex;align-items:center;gap:var(--space-2);max-width:min(520px,100%);padding:var(--space-2) var(--space-3);margin:var(--space-2) 0;
  border:1px solid var(--borda);border-radius:var(--radius-control);background:var(--superficie);font-size:var(--text-small-size);color:var(--texto-secundario);text-align:left}
.wa-evento svg{width:14px;height:14px;flex:none;color:var(--acento)}
.wa-evento.alerta svg{color:var(--aviso)}
.wa-evento.ok svg{color:var(--sucesso-forte)}
.wa-evento time{font-variant-numeric:tabular-nums;color:var(--texto-primario);font-weight:600}
.wa-novas{align-self:stretch;display:flex;align-items:center;gap:var(--space-3);margin:var(--space-2) 0;font-size:var(--text-small-size);font-weight:600;color:var(--sucesso-forte)}
.wa-novas::before,.wa-novas::after{content:"";flex:1;height:1px;background:var(--verde-100)}
.wa-m{display:flex;flex-direction:column;max-width:min(560px,76%);margin-top:var(--space-2)}
.wa-m.seguida{margin-top:0}
.wa-m.recebida{align-self:flex-start}
.wa-m.enviada{align-self:flex-end;align-items:flex-end}
.wa-m.nota{align-self:stretch;max-width:none;align-items:stretch}
.wa-balao{position:relative;padding:6px 10px 6px 12px;border-radius:var(--radius-card);line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;
  background:var(--superficie);color:var(--texto-primario);box-shadow:var(--sombra-cartao);border:1px solid var(--borda)}
.wa-m.recebida:not(.seguida) .wa-balao{border-top-left-radius:var(--radius-pequeno)}
.wa-m.enviada .wa-balao{background:var(--verde-100);border-color:var(--verde-100)}
.wa-m.enviada:not(.seguida) .wa-balao{border-top-right-radius:var(--radius-pequeno)}
.wa-m.nota .wa-balao{background:var(--aviso-suave);border-color:var(--laranja-100);color:var(--aviso-texto);border-radius:var(--radius-control)}
.wa-m.nota .wa-balao b{display:inline-flex;align-items:center;gap:6px;margin-right:6px}
.wa-m.nota .wa-balao b svg{width:13px;height:13px}
.wa-m-rodape{display:inline-flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:-2px;float:right;padding-left:var(--space-3);
  font-size:11px;color:var(--texto-secundario);font-variant-numeric:tabular-nums;line-height:1}
.wa-m .wa-balao .wa-m-rodape{position:relative;top:4px}
.wa-m-rodape .wa-autor{color:var(--texto-secundario)}
.wa-tick{display:inline-flex;width:16px;height:12px;color:var(--texto-secundario)}
.wa-tick svg{width:16px;height:12px}
.wa-tick.lida{color:var(--info)}
.wa-tick.falhou{color:var(--erro)}
.wa-m.nova .wa-balao{animation:wa-surgir var(--duracao-normal) ease-out}
@keyframes wa-surgir{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.wa-anexo{display:inline-flex;align-items:center;gap:var(--space-2);padding:6px 10px;border-radius:var(--radius-control);background:var(--fundo);border:1px solid var(--borda);
  font-size:var(--text-table-size);margin-bottom:4px}
.wa-anexo svg{width:16px;height:16px;color:var(--acento)}
mark.wa-achado{background:var(--aviso-suave);color:inherit;border-radius:2px}

/* O que PEDE AÇÃO entra na conversa como aviso com os botões da agenda — a regra é a do Clinica. */
.wa-acao{margin:var(--space-2) var(--space-6) 0;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-3);padding:var(--space-3) var(--space-4)}
.wa-acao .wa-acao-texto{flex:1 1 300px;min-width:0;font-size:var(--text-table-size)}
.wa-acao strong{display:block;margin-bottom:2px;font-size:var(--text-body-size)}
.wa-acao .botoes-linha{flex-wrap:wrap;justify-content:flex-start}

/* Escrever: um bloco com os dois modos; a nota interna muda a cor do bloco inteiro. */
.wa-escrever-wrap{position:relative}
.wa-escrever{margin:var(--space-2) var(--space-6) var(--space-4);border:1px solid var(--borda);border-radius:var(--radius-card);background:var(--superficie);
  box-shadow:var(--sombra-cartao);display:flex;flex-direction:column;transition:background var(--duracao-normal),border-color var(--duracao-normal)}
.wa-escrever:focus-within{border-color:var(--foco);box-shadow:0 0 0 3px var(--acento-tint)}
.wa-escrever.nota{background:var(--aviso-suave);border-color:var(--laranja-100)}
.wa-escrever.nota:focus-within{box-shadow:0 0 0 3px var(--laranja-100)}
.wa-escrever-abas{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3) 0}
.wa-escrever-abas .segmentado button{padding:4px 10px;font-size:var(--text-small-size);display:inline-flex;align-items:center;gap:6px}
.wa-escrever-abas small{color:var(--texto-secundario);font-size:var(--text-small-size)}
.wa-escrever.nota .wa-escrever-abas small{color:var(--aviso-texto)}
.wa-escrever textarea{border:0;background:transparent;resize:none;padding:var(--space-2) var(--space-3);min-height:44px;max-height:180px;font:inherit;line-height:1.45;
  color:var(--texto-primario);outline:none;width:100%}
.wa-escrever textarea::placeholder{color:var(--texto-secundario)}
.wa-escrever-rodape{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1);padding:0 var(--space-2) var(--space-2) var(--space-2)}
.wa-escrever-rodape .botao.mini{height:30px;border-color:transparent;background:transparent;font-weight:500;color:var(--cinza-700)}
.wa-escrever-rodape .botao.mini:hover:not(:disabled){background:var(--fundo);border-color:transparent}
.wa-escrever-rodape .botao.mini[aria-expanded="true"]{background:var(--acento-suave);color:var(--acento)}
.wa-atalho{margin-left:auto;font-size:var(--text-small-size);color:var(--texto-secundario);padding-right:var(--space-2)}
.wa-escrever-rodape .botao.primario{height:34px;padding:0 var(--space-4)}
.wa-escrever-rodape .botao.primario:disabled{opacity:.45}
.wa-rascunho-anexo{display:flex;align-items:center;gap:var(--space-2);margin:0 var(--space-3);padding:6px 10px;border-radius:var(--radius-control);background:var(--fundo);
  font-size:var(--text-table-size)}
.wa-rascunho-anexo .fechar{width:24px;height:24px;font-size:18px;margin-left:auto}

/* Fora da janela de 24 h: o campo livre some e a tela diz o porquê e o caminho (um modelo aprovado). */
.wa-janela-fechada{margin:var(--space-2) var(--space-6) var(--space-4);padding:var(--space-3) var(--space-4);border:1px solid var(--borda);border-radius:var(--radius-card);
  background:var(--superficie);display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-4)}
.wa-janela-ic{width:36px;height:36px;border-radius:var(--radius-control);display:grid;place-items:center;background:var(--cinza-100);color:var(--cinza-700);flex:none}
.wa-janela-ic svg{width:18px;height:18px}
.wa-janela-texto{flex:1 1 260px;min-width:0;font-size:var(--text-table-size);color:var(--texto-secundario)}
.wa-janela-texto strong{display:block;color:var(--texto-primario);font-size:var(--text-body-size)}
.wa-encerrada{margin:var(--space-2) var(--space-6) var(--space-4);padding:var(--space-3) var(--space-4);border-radius:var(--radius-card);background:var(--superficie);border:1px solid var(--borda);
  display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);font-size:var(--text-table-size);color:var(--texto-secundario)}
.wa-encerrada strong{color:var(--texto-primario)}
.wa-encerrada .botao{margin-left:auto}

/* Vazio: nenhuma conversa escolhida */
.wa-vazia{flex:1;display:flex;align-items:center;justify-content:center;padding:var(--space-8)}
.wa-vazia .vazio-estado{max-width:380px}

/* ---------- Popovers do escrever (modelos, respostas rápidas): por cima, nunca cortados ---------- */
.wa-popover{position:absolute;left:var(--space-6);right:var(--space-6);bottom:calc(100% + var(--space-2));z-index:20;max-width:560px;
  background:var(--superficie);border:1px solid var(--borda);border-radius:var(--radius-card);box-shadow:var(--sombra-popup);display:flex;flex-direction:column;
  max-height:min(440px,70vh);overflow:hidden;animation:wa-surgir var(--duracao-normal) ease-out}
.wa-popover-topo{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4) var(--space-2)}
.wa-popover-topo h3{margin:0;font-size:var(--text-table-size);font-weight:700;flex:1}
.wa-popover-topo small{color:var(--texto-secundario)}
.wa-popover-lista{overflow-y:auto;padding:0 var(--space-2) var(--space-2);display:flex;flex-direction:column;gap:2px}
.wa-opcao{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;background:transparent;padding:var(--space-2) var(--space-3);border-radius:var(--radius-control);
  cursor:pointer;font:inherit;color:var(--texto-primario)}
.wa-opcao:hover{background:var(--fundo)}
.wa-opcao:focus-visible{outline:2px solid var(--foco);outline-offset:-2px}
.wa-opcao strong{font-size:var(--text-table-size);display:flex;align-items:center;gap:var(--space-2)}
.wa-opcao strong .selo{margin-left:0}
.wa-opcao span{font-size:var(--text-small-size);color:var(--texto-secundario);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wa-modelo-form{padding:var(--space-3) var(--space-4) var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);border-top:1px solid var(--borda);overflow-y:auto}
.wa-modelo-previa{padding:var(--space-3);border-radius:var(--radius-card);background:var(--verde-100);line-height:1.45;white-space:pre-wrap;font-size:var(--text-table-size)}
.wa-modelo-previa var{font-style:normal;background:var(--superficie);border-radius:var(--radius-pequeno);padding:0 4px;color:var(--acento);font-weight:600}
.wa-modelo-form .botoes-linha{justify-content:flex-end}

/* ---------- Coluna 3, no modo Retenção: o CASO do Acompanhamento vem antes da ficha ---------- */
.wa-caso{background:var(--superficie)}
.wa-caso h4{margin:var(--space-2) 0 0;font-size:var(--text-small-size);font-weight:700;color:var(--texto-secundario);text-transform:uppercase;letter-spacing:var(--text-secao-tracking)}
.wa-desfechos{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.wa-desfechos .botao.mini{height:30px}
.wa-convite{margin:var(--space-2) var(--space-6) var(--space-4);padding:var(--space-4);border:1px solid var(--verde-100);border-radius:var(--radius-card);background:var(--superficie);
  display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3) var(--space-4);box-shadow:var(--sombra-cartao)}
.wa-convite .wa-janela-ic{background:var(--verde-100);color:var(--sucesso-forte)}
.wa-convite .wa-janela-texto strong{margin-bottom:2px}
@media (max-width:1180px){.wa-convite{margin-left:var(--space-4);margin-right:var(--space-4)}}

/* ---------- Coluna 3: o paciente, lido do Clinica ---------- */
.wa-ficha{overflow-y:auto}
.wa-ficha-topo{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-3) 0 var(--space-4)}
.wa-ficha-topo h2{margin:0;font-size:var(--text-secao-size);font-weight:700;text-transform:uppercase;letter-spacing:var(--text-secao-tracking);color:var(--texto-secundario);flex:1}
.wa-secao{padding:var(--space-4);border-bottom:1px solid var(--borda);display:flex;flex-direction:column;gap:var(--space-2)}
.wa-secao:last-child{border-bottom:0}
.wa-secao > h3{margin:0;font-size:var(--text-table-size);font-weight:700;color:var(--texto-primario);display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
.wa-secao > h3 .link{font-size:var(--text-small-size)}
.wa-pessoa{display:flex;align-items:center;gap:var(--space-3)}
.wa-pessoa .avatar{width:48px;height:48px;font-size:16px}
.wa-pessoa-nome{display:flex;flex-direction:column;min-width:0;gap:2px}
.wa-pessoa-nome strong{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wa-pessoa-nome span{font-size:var(--text-small-size);color:var(--texto-secundario)}
.wa-pares{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px var(--space-3);margin:0;font-size:var(--text-table-size)}
.wa-pares dt{color:var(--texto-secundario)}
.wa-pares dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.wa-pares dd .selo{margin-left:0}
.wa-selos{display:flex;flex-wrap:wrap;gap:var(--space-1)}
.wa-selos .selo{margin-left:0}
.wa-horario{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3);border:1px solid var(--borda);border-radius:var(--radius-control);background:var(--superficie)}
.wa-horario.tom-perigo{border-color:var(--vermelho-100);background:var(--erro-suave)}
.wa-horario.tom-sucesso{border-color:var(--verde-100)}
.wa-horario-topo{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
.wa-horario-topo b{font-variant-numeric:tabular-nums}
.wa-horario-topo .selo{margin-left:0;white-space:nowrap}
.wa-horario small{color:var(--texto-secundario);font-size:var(--text-small-size);line-height:1.4}
.wa-horario .botoes-linha{justify-content:flex-start;flex-wrap:wrap}
.wa-horario.apagado{opacity:.72}
.wa-horario.apagado .wa-horario-topo b{text-decoration:line-through;text-decoration-color:var(--cinza-300)}
.wa-tempo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:var(--text-table-size)}
.wa-tempo li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:var(--space-2);align-items:start}
.wa-tempo time{color:var(--texto-secundario);font-variant-numeric:tabular-nums;font-size:var(--text-small-size);padding-top:2px;white-space:nowrap}
.wa-tempo li span{min-width:0;line-height:1.4}
.wa-dica{font-size:var(--text-small-size);color:var(--texto-secundario);line-height:1.45;margin:0}
.wa-sem-ficha{display:flex;flex-direction:column;gap:var(--space-2)}
.wa-sem-ficha .busca .campo{height:34px;min-height:34px}
.wa-candidatos{display:flex;flex-direction:column;gap:2px}
.wa-candidato{display:grid;grid-template-columns:32px minmax(0,1fr);gap:var(--space-2);align-items:center;width:100%;text-align:left;border:1px solid var(--borda);
  border-radius:var(--radius-control);background:var(--superficie);padding:6px 8px;cursor:pointer;font:inherit;color:var(--texto-primario)}
.wa-candidato:hover{border-color:var(--acento);background:var(--acento-suave)}
.wa-candidato .avatar{width:32px;height:32px;font-size:11px}
.wa-candidato span{display:block;font-size:var(--text-small-size);color:var(--texto-secundario)}
.wa-candidato strong{font-size:var(--text-table-size)}

/* Só aparece em janela estreita: o botão que abre a coluna do paciente por cima da conversa. */
.wa-so-estreito{display:none!important}
.wa-ficha-fechar{display:none}
@media (max-width:1180px){
  .pagina.wa{grid-template-columns:300px minmax(0,1fr);grid-template-areas:"lista conversa"}
  .wa-so-estreito{display:inline-flex!important}
  .wa-ficha{position:absolute;top:0;right:0;bottom:0;width:min(340px,100%);box-shadow:var(--sombra-popup);transform:translateX(100%);
    transition:transform var(--duracao-normal) ease-out;z-index:25}
  .wa-ficha.aberta{transform:none}
  .wa-ficha-fechar{display:inline-flex}
  .wa-mensagens{padding:var(--space-3) var(--space-4)}
  .wa-acao,.wa-escrever,.wa-janela-fechada,.wa-encerrada{margin-left:var(--space-4);margin-right:var(--space-4)}
  .wa-popover{left:var(--space-4);right:var(--space-4)}
  /* Sem a coluna da ficha, a bolinha do chat da equipe cai sobre o canto do Enviar: o rodapé deixa o lugar dela. */
  .wa-escrever-rodape,.wa-convite,.wa-janela-fechada{padding-right:calc(var(--space-12) + var(--space-8))}
  /* A lista tem 300 px: o seletor de modo perde o ícone e os filtros apertam. */
  .wa-modo .icone{display:none}
  .wa-modo button{padding:6px 6px;font-size:var(--text-table-size)}
  .wa-filtros .segmentado button{padding:5px 4px;font-size:var(--text-small-size);white-space:nowrap}
}
/* Celular: um painel por vez — a lista, e a conversa por cima dela com "voltar". */
.wa-voltar{display:none}
@media (max-width:760px){
  .pagina.wa{grid-template-columns:1fr;grid-template-areas:"lista"}
  .wa-lista{border-right:0}
  .wa-conversa{position:absolute;inset:0;z-index:20;transform:translateX(100%);transition:transform var(--duracao-normal) ease-out}
  .wa-conversa.aberta{transform:none}
  .wa-voltar{display:inline-flex}
  .wa-cab{padding-left:var(--space-2)}
  .wa-cab-acoes .botao:not(.icone) span{display:none}
  .wa-cab-acoes .botao:not(.icone){width:34px;padding:0;justify-content:center}
  .wa-m{max-width:88%}
  .wa-faixa{display:none}
  .wa-cab-acoes [data-acao="buscar"],.wa-cab-acoes [data-acao="encerrar"],.wa-cab-acoes [data-acao="transferir"],.wa-cab-meta .selo,.wa-cab-meta .selo + span{display:none}
  .wa-cab-meta{flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
}
@media (prefers-reduced-motion:reduce){.wa-conversa,.wa-ficha{transition:none}.wa-m.nova .wa-balao,.wa-popover{animation:none}}

/* ---------- Formulários (Modal da casa): conferir a ficha, transferir, encerrar, outras vagas, cancelar ---------- */
.wa-opcoes{display:flex;flex-direction:column;gap:var(--space-2)}
.wa-escolha{display:grid;grid-template-columns:20px 40px minmax(0,1fr);gap:var(--space-3);align-items:start;padding:var(--space-3);
  border:1px solid var(--borda);border-radius:var(--radius-control);cursor:pointer;background:var(--superficie);transition:border-color var(--duracao-rapida),background var(--duracao-rapida)}
.wa-escolha:hover{border-color:var(--borda-hover)}
.wa-escolha.marcada{border-color:var(--acento);background:var(--acento-suave)}
.wa-escolha input{width:16px;height:16px;margin:3px 0 0;accent-color:var(--acento)}
.wa-escolha .avatar{width:40px;height:40px;font-size:13px}
.wa-escolha.sem-avatar{grid-template-columns:20px minmax(0,1fr)}
.wa-escolha-texto{display:flex;flex-direction:column;gap:4px;min-width:0}
.wa-escolha-texto strong{font-size:15px}
.wa-escolha-texto span{font-size:var(--text-small-size);color:var(--texto-secundario)}
.wa-conferir{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-4);margin:0;font-size:var(--text-small-size)}
.wa-conferir div{display:flex;gap:6px}
.wa-conferir dt{color:var(--texto-secundario)}
.wa-conferir dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.wa-vagas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--space-2)}
.wa-vaga{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:var(--space-3);border:1px solid var(--borda);border-radius:var(--radius-control);background:var(--superficie);
  cursor:pointer;font:inherit;text-align:left;color:var(--texto-primario)}
.wa-vaga:hover{border-color:var(--borda-hover)}
.wa-vaga[aria-pressed="true"]{border-color:var(--acento);background:var(--acento-suave)}
.wa-vaga b{font-variant-numeric:tabular-nums}
.wa-vaga span{font-size:var(--text-small-size);color:var(--texto-secundario)}

/* ===== só do mockup: a janela do app é a janela toda ===== */
:root{color-scheme:light}html,body{height:100%}body{background:var(--fundo);color:var(--texto-primario)}
[hidden]{display:none!important}
.moldura{height:100%}
</style>
</head>
<body>
<div class="moldura">
  <header class="moldura-topo">

        <li class="moldura-grupo"><button type="button" role="menuitem">Agenda <svg class='icone' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true' focusable='false'><path d='m6 9 6 6 6-6'/></svg></button></li>
        <li class="moldura-grupo"><button type="button" role="menuitem">Pacientes <svg class='icone' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true' focusable='false'><path d='m6 9 6 6 6-6'/></svg></button></li>
        <li class="moldura-grupo"><button type="button" role="menuitem">Marcar <svg class='icone' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true' focusable='false'><path d='m6 9 6 6 6-6'/></svg></button></li>
        <li class="moldura-grupo"><button type="button" role="menuitem">Relacionamento <svg class='icone' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true' focusable='false'><path d='m6 9 6 6 6-6'/></svg></button></li>

          <span class="avatar pequeno" aria-hidden="true">AP</span>
          <span class="moldura-usuario-nome">Ana Paula</span>
          <svg class='icone' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true' focusable='false'><path d='m6 9 6 6 6-6'/></svg>
        </button>

  </header>

  <div class="moldura-corpo">
  <main class="moldura-area">

  <div class="pagina wa" id="wa">

    <!-- Coluna 1: a lista (do CRM) -->
    <aside class="wa-lista" aria-label="Conversas">
      <div class="wa-lista-topo">
        <h1 class="sr-so"><span id="wa-total"></span></h1>
        <div class="segmentado wa-modo" role="group" aria-label="O que a lista mostra" id="wa-modo"></div>
        <button type="button" class="botao icone" id="wa-nova" title="Nova conversa" aria-label="Nova conversa"><svg class='icone' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true' focusable='false'><path d='M12 5v14M5 12h14'/></svg></button>

          <div class="busca"><svg class='icone' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true' focusable='false'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg><input class="campo" id="wa-busca" type="search" placeholder="Nome ou telefone" aria-label="Buscar conversa" autocomplete="off" /></div>
          <button type="button" class="chip" id="wa-so-nao-lidas" aria-pressed="false" title="Só as não lidas">Não lidas</button>
        </div>
      </div>
      <div class="wa-linhas" id="wa-linhas" role="listbox" aria-label="Lista de conversas"></div>
      <div class="wa-lista-rodape" id="wa-lista-rodape"></div>

    <!-- Coluna 2: a conversa (do CRM) -->

  </div>
  </main>
  <div class="chat-flutuante"><button type="button" class="chat-bola" title="Chat da equipe" aria-label="Chat da equipe, 2 mensagens não lidas"><svg class='icone' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true' focusable='false'><path d='M21 12a8 8 0 0 1-11.6 7.2L4 21l1.8-5.4A8 8 0 1 1 21 12z'/></svg><span class="chat-contador">2</span></button></div>
  </div>
</div>

<div id="wa-modal" hidden></div>

<script>
const ICONES = {"abaixo": "<path d='m6 9 6 6 6-6'/>", "sino": "<path d='M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9'/><path d='M10.3 21a1.94 1.94 0 0 0 3.4 0'/>", "busca": "<circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/>", "atualizar": "<path d='M21 12a9 9 0 1 1-2.64-6.36'/><path d='M21 3v6h-6'/>", "mais": "<path d='M12 5v14M5 12h14'/>", "chat": "<path d='M21 12a8 8 0 0 1-11.6 7.2L4 21l1.8-5.4A8 8 0 1 1 21 12z'/>", "pessoa": "<circle cx='12' cy='8' r='4'/><path d='M4 21a8 8 0 0 1 16 0'/>", "transferir": "<path d='M4 7h13'/><path d='m14 4 3 3-3 3'/><path d='M20 17H7'/><path d='m10 14-3 3 3 3'/>", "check": "<path d='m5 12 5 5 9-10'/>", "ficha": "<rect x='4' y='3' width='16' height='18' rx='2'/><path d='M8 8h8M8 12h8M8 16h5'/>", "alerta": "<circle cx='12' cy='12' r='9'/><path d='M12 8v5M12 16h.01'/>", "info": "<circle cx='12' cy='12' r='9'/><path d='M12 11v5M12 8h.01'/>", "cal": "<rect x='3' y='5' width='18' height='16' rx='2'/><path d='M3 10h18M8 3v4M16 3v4'/>", "nota": "<path d='M4 4h12l4 4v12H4z'/><path d='M8 13h8M8 17h5'/>", "anexo": "<path d='m21 12-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8'/>", "modelo": "<rect x='4' y='4' width='16' height='16' rx='2'/><path d='M4 10h16M10 10v10'/>", "enviar": "<path d='m3 11 18-8-8 18-2-8z'/>", "lido": "<path d='m2 12 4 4 7-8'/><path d='m10 16 1 1 9-10'/>", "tick": "<path d='m4 12 5 5 11-11'/>", "ticks": "<path d='m2 12 4 4 7-8'/><path d='m10 16 1 1 9-10'/>", "relogio": "<circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 2'/>", "cadeado": "<rect x='5' y='11' width='14' height='10' rx='2'/><path d='M8 11V8a4 4 0 0 1 8 0v3'/>", "fechar": "<path d='M6 6l12 12M18 6 6 18'/>", "bolt": "<path d='M13 3 5 14h6l-1 7 8-11h-6z'/>", "esquerda": "<path d='m15 18-6-6 6-6'/>", "sms": "<rect x='3' y='5' width='18' height='14' rx='2'/><path d='M7 10h10M7 14h6'/>", "arquivo": "<path d='M6 3h8l4 4v14H6z'/><path d='M14 3v4h4'/>", "vazio": "<rect x='4' y='4' width='16' height='16' rx='3'/><path d='M4 13h4l2 3h4l2-3h4'/>", "coracao": "<path d='M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z'/>"};
/* O mockup interativo da tela "WhatsApp da clínica" (proposta, out/2026).
   Dados fictícios + renderização em JS puro, para a direção CLICAR antes de o Razor existir.
   No app, cada função daqui tem um dono: o que a tela AFIRMA (selo, janela de 24 h, o que
   pede ação) mora em ConversasNaTela (Application, com teste); as ações da agenda são do
   AgendaService; o CRM só recebe/envia mensagens e guarda a conversa. */
(function () {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ic = (nome, cls) => `<svg class="icone${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICONES[nome] || ICONES.info}</svg>`;

  // O relógio do mockup: a tela "nasce" às 10:12 de sexta, 24/10/2026, e anda com o relógio real.
  const INICIO = Date.now(); const BASE_MIN = 10 * 60 + 12;
  const agora = () => { const m = BASE_MIN + Math.floor((Date.now() - INICIO) / 60000); return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
  let ordemSeq = 1000; const proximaOrdem = () => ++ordemSeq;

  const EU = { id: 'ana', nome: 'Ana Paula' };
  const EQUIPE = [{ id: 'ana', nome: 'Ana Paula' }, { id: 'bruna', nome: 'Bruna' }, { id: 'carla', nome: 'Carla' }, { id: 'paulo', nome: 'Paulo (Financeiro)' }];
  const nomeDe = id => (EQUIPE.find(e => e.id === id) || {}).nome || 'Sem responsável';

  const MODELOS = [
    { id: 'lembrete_sessao', categoria: 'Utilidade', texto: 'Olá, {{1}}! Lembrando que você tem {{2}} na Clínica SemDor {{3}}. Responda SIM para confirmar ou NÃO se precisar remarcar.', params: ['Primeiro nome', 'Atendimento', 'Dia e hora'] },

  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (estado.popover) { estado.popover = null; const p = $('#wa-popover'); if (p) p.innerHTML = ''; document.querySelectorAll('[data-acao="modelos"],[data-acao="rapidas"]').forEach(b => b.setAttribute('aria-expanded', 'false')); } if (!$('#sino-popover').hidden) fecharSino(); if (estado.fichaAberta) acao('fechar-ficha'); } });
  document.addEventListener('click', e => { if (estado.popover && !e.target.closest('.wa-popover') && !e.target.closest('[data-acao="modelos"],[data-acao="rapidas"],[data-acao="ret-preparar"]')) { estado.popover = null; const p = $('#wa-popover'); if (p) p.innerHTML = ''; document.querySelectorAll('[data-acao="modelos"],[data-acao="rapidas"]').forEach(b => b.setAttribute('aria-expanded', 'false')); } });

  CONVERSAS.forEach(c => { c.naoLidasAoAbrir = c.naoLidas; c.modo = 'responder'; c.rascunho = ''; });
  RETENCAO.forEach(r => { if (!r.paciente && r.convId) r.paciente = (CONVERSAS.find(c => c.id === r.convId) || {}).paciente; });
  renderFiltro(); renderLista(); renderConversa(); renderFicha(); renderSino();
  // A direção abre o mockup já numa conversa (a que mais pede ação); #vazia mostra o estado sem conversa.
  const alvo = location.hash.replace('#', '');
  if (alvo === 'retencao' || alvo === 'retencao-respondeu' || alvo === 'retencao-ligar') { estado.modo = 'retencao'; renderFiltro(); abrirRetencao(alvo === 'retencao-respondeu' ? 'alzira' : alvo === 'retencao-ligar' ? 'helena' : 'seb'); }
  else if (alvo === 'vazia') { /* fica na lista */ } else if (alvo === 'ficha') { abrir('terezinha'); modalConferirFicha(conv('terezinha')); } else if (alvo === 'fechada') { abrir('carlos'); } else if (alvo === 'nova') { abrir('novo'); } else if (alvo && conv(alvo)) { abrir(alvo); } else { abrir('maria'); }
  if (alvo === 'contexto') { estado.fichaAberta = true; $('#wa-ficha').classList.add('aberta'); }
})();

</script>
