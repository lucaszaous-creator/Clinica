name: Release (instalador + auto-update)

# Gera o INSTALADOR com Velopack e publica nas GitHub Releases.
# O app instalado se atualiza sozinho a partir daqui.
#
# Como publicar uma nova versão:
#   - Aba Actions -> "Release (instalador + auto-update)" -> Run workflow -> informe a versão (ex.: 1.0.0)
#   - OU crie uma tag: git tag v1.0.0 && git push origin v1.0.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex.: 1.0.0)'
        required: true
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  # ==========================================================================
  # Faturamento — o app que já está instalado na clínica.
  # NÃO MUDAR packId nem canal: as instalações existentes perdem o canal de
  # auto-update e param de atualizar. É também quem CRIA a release da versão;
  # os apps da suíte só se juntam a ela depois (job "suite", com --merge).
  # ==========================================================================
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Definir versão
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = "${{ github.event.inputs.version }}"
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "Versão: $v"

      - name: Instalar Velopack CLI (vpk)
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.0
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Publicar (pasta self-contained)
        run: dotnet publish src/Clinica.Desktop/Clinica.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Empacotar com Velopack
        run: >
          vpk pack
          --packId Clinica.Faturamento
          --packVersion ${{ steps.ver.outputs.version }}
          --packDir publish
          --mainExe Clinica.Desktop.exe
          --packTitle "Clínica SemDor"

      - name: Publicar no GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          vpk upload github
          --repoUrl https://github.com/lucaszaous-creator/Clinica
          --publish
          --releaseName "Clínica SemDor ${{ steps.ver.outputs.version }}"
          --tag v${{ steps.ver.outputs.version }}
          --token $env:GITHUB_TOKEN

  # ==========================================================================
  # Suíte multi-exe (ver docs/arquitetura-multi-exe.md).
  #
  # Os três apps entram na MESMA release do faturamento, cada um no seu CANAL:
  # o Velopack grava um releases.<canal>.json por canal, e o app instalado só
  # enxerga o do canal com que foi empacotado. Por isso nada aqui pode colidir
  # com o canal padrão (win) do faturamento.
  #
  # Roda DEPOIS do faturamento (needs) e um de cada vez (max-parallel: 1),
  # porque os três fazem --merge na mesma release — em paralelo, disputariam.
  # Se este job falhar, a release do faturamento já saiu inteira.
  # ==========================================================================
  suite:
    needs: release
    runs-on: windows-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - nome: Recepção
            projeto: src/Clinica.Recepcao/Clinica.Recepcao.csproj
            packId: Clinica.Recepcao
            mainExe: Clinica.Recepcao.exe
            canal: recepcao
            titulo: Clínica SemDor — Recepção
          - nome: Financeiro
            projeto: src/Clinica.Financeiro/Clinica.Financeiro.csproj
            packId: Clinica.Financeiro
            mainExe: Clinica.Financeiro.exe
            canal: financeiro
            titulo: Clínica SemDor — Financeiro
          - nome: Gerente Geral
            projeto: src/Clinica.Gerente/Clinica.Gerente.csproj
            packId: Clinica.Gerente
            mainExe: Clinica.Gerente.exe
            canal: gerente
            titulo: Clínica SemDor — Gerente Geral
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Instalar Velopack CLI (vpk)
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.0
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Publicar ${{ matrix.nome }} (pasta self-contained)
        run: dotnet publish ${{ matrix.projeto }} -c Release -r win-x64 --self-contained true -p:Version=${{ needs.release.outputs.version }} -o publish

      - name: Empacotar ${{ matrix.nome }} com Velopack
        run: >
          vpk pack
          --packId ${{ matrix.packId }}
          --packVersion ${{ needs.release.outputs.version }}
          --packDir publish
          --mainExe ${{ matrix.mainExe }}
          --packTitle "${{ matrix.titulo }}"
          --channel ${{ matrix.canal }}

      - name: Publicar ${{ matrix.nome }} na release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          vpk upload github
          --repoUrl https://github.com/lucaszaous-creator/Clinica
          --publish
          --merge
          --channel ${{ matrix.canal }}
          --releaseName "Clínica SemDor ${{ needs.release.outputs.version }}"
          --tag v${{ needs.release.outputs.version }}
          --token $env:GITHUB_TOKEN
