name: Release (instalador + auto-update)

# Gera o INSTALADOR com Velopack e publica nas GitHub Releases.
# O app instalado se atualiza sozinho a partir daqui.
#
# CADA APP TEM SUA PRÓPRIA RELEASE E SUA PRÓPRIA VERSÃO. Antes, os quatro saíam
# juntos — e corrigir uma vírgula no Financeiro obrigava a republicar o Faturamento,
# que está em produção na clínica: download e reinício reais numa máquina que não
# ganhou nada com a mudança.
#
# Como publicar:
#   Faturamento  →  git tag v1.2.3            && git push origin v1.2.3
#   Recepção     →  git tag recepcao-v1.1.3   && git push origin recepcao-v1.1.3
#   Financeiro   →  git tag financeiro-v1.0.0 && git push origin financeiro-v1.0.0
#   Gerente      →  git tag gerente-v1.1.1    && git push origin gerente-v1.1.1
#   Consultório  →  git tag clinico-v1.0.0    && git push origin clinico-v1.0.0
#
#   Ou: Actions -> "Release" -> Run workflow -> escolha o app e informe a versão.
#
# CADA APP TEM SUA PRÓPRIA CONTAGEM DE VERSÃO. Elas não andam juntas: o Faturamento
# está na 1.1.x há semanas e o Financeiro nunca foi publicado. Repetir um número já
# usado NAQUELE app é o erro comum — e o passo "Conferir se a versão já foi publicada"
# recusa antes de compilar, dizendo qual é o próximo livre.
#
# Funciona porque o Velopack separa os apps por CANAL: cada um grava seu
# releases.<canal>.json, e o GetReleaseFeed percorre as releases procurando o canal
# do app instalado, em vez de olhar só a mais recente.

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Qual app publicar'
        required: true
        type: choice
        options: [faturamento, recepcao, financeiro, gerente, clinico]
      version:
        description: 'Versão (ex.: 1.0.0)'
        required: true
  push:
    tags:
      - 'v*.*.*'
      - 'recepcao-v*.*.*'
      - 'financeiro-v*.*.*'
      - 'gerente-v*.*.*'
      - 'clinico-v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Descobre QUAL app e QUAL versão, seja pela tag ou pelo disparo manual.
      #
      # ⚠️ packId e canal do FATURAMENTO não mudam nunca: as instalações que já
      # existem na clínica perdem o canal de auto-update e param de atualizar.
      - name: Identificar app e versão
        id: alvo
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $ref = "${{ github.ref_name }}"
            if ($ref -match '^v(.+)$')                 { $app = "faturamento"; $v = $Matches[1] }
            elseif ($ref -match '^recepcao-v(.+)$')    { $app = "recepcao";    $v = $Matches[1] }
            elseif ($ref -match '^financeiro-v(.+)$')  { $app = "financeiro";  $v = $Matches[1] }
            elseif ($ref -match '^gerente-v(.+)$')     { $app = "gerente";     $v = $Matches[1] }
            elseif ($ref -match '^clinico-v(.+)$')     { $app = "clinico";     $v = $Matches[1] }
            else { throw "Tag '$ref' não corresponde a nenhum app." }
          } else {
            $app = "${{ github.event.inputs.app }}"
            $v   = "${{ github.event.inputs.version }}"
          }

          $cfg = @{
            faturamento = @{ projeto = "src/Clinica.Desktop/Clinica.Desktop.csproj";       packId = "Clinica.Faturamento"; mainExe = "Clinica.Desktop.exe";    canal = "win";        titulo = "Clínica SemDor";                    prefixo = "v" }
            recepcao    = @{ projeto = "src/Clinica.Recepcao/Clinica.Recepcao.csproj";     packId = "Clinica.Recepcao";    mainExe = "Clinica.Recepcao.exe";   canal = "recepcao";   titulo = "Clínica SemDor — Recepção";         prefixo = "recepcao-v" }
            financeiro  = @{ projeto = "src/Clinica.Financeiro/Clinica.Financeiro.csproj"; packId = "Clinica.Financeiro";  mainExe = "Clinica.Financeiro.exe"; canal = "financeiro"; titulo = "Clínica SemDor — Financeiro";       prefixo = "financeiro-v" }
            gerente     = @{ projeto = "src/Clinica.Gerente/Clinica.Gerente.csproj";       packId = "Clinica.Gerente";     mainExe = "Clinica.Gerente.exe";    canal = "gerente";    titulo = "Clínica SemDor — Gerente Geral";    prefixo = "gerente-v" }
            clinico     = @{ projeto = "src/Clinica.Clinico/Clinica.Clinico.csproj";       packId = "Clinica.Clinico";     mainExe = "Clinica.Clinico.exe";    canal = "clinico";    titulo = "Clínica SemDor — Consultório";      prefixo = "clinico-v" }
          }[$app]

          if (-not $cfg) { throw "App desconhecido: '$app'." }

          "app=$app"                  >> $env:GITHUB_OUTPUT
          "version=$v"                >> $env:GITHUB_OUTPUT
          "projeto=$($cfg.projeto)"   >> $env:GITHUB_OUTPUT
          "packId=$($cfg.packId)"     >> $env:GITHUB_OUTPUT
          "mainExe=$($cfg.mainExe)"   >> $env:GITHUB_OUTPUT
          "canal=$($cfg.canal)"       >> $env:GITHUB_OUTPUT
          "titulo=$($cfg.titulo)"     >> $env:GITHUB_OUTPUT
          "prefixo=$($cfg.prefixo)"   >> $env:GITHUB_OUTPUT
          "tag=$($cfg.prefixo)$v"     >> $env:GITHUB_OUTPUT
          Write-Host "Publicando $app $v (canal $($cfg.canal), tag $($cfg.prefixo)$v)"

      # ⚠️ PRÉ-VOO: o vpk só descobre que a versão já existe no ÚLTIMO passo, depois de
      # compilar e empacotar os quatro minutos de build — e a mensagem dele não diz qual
      # versão usar. Aqui a recusa é imediata e já entrega o próximo número livre.
      #
      # Só olha as tags DESTE app (cada um tem sua família de versões): publicar a
      # Recepção nunca é impedido por uma versão que o Financeiro já usou.
      - name: Conferir se a versão já foi publicada
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $prefixo = "${{ steps.alvo.outputs.prefixo }}"
          $tag     = "${{ steps.alvo.outputs.tag }}"
          $cabecalho = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; "User-Agent" = "clinica-release" }

          # Todas as tags do repositório (paginado).
          $tags = @()
          for ($p = 1; $p -le 10; $p++) {
            $lote = Invoke-RestMethod -Headers $cabecalho `
              "https://api.github.com/repos/${{ github.repository }}/tags?per_page=100&page=$p"
            if (-not $lote) { break }
            $tags += $lote.name
          }

          # Só as deste app, e só as que são versão de verdade (x.y.z).
          $padrao = "^" + [regex]::Escape($prefixo) + "(\d+)\.(\d+)\.(\d+)$"
          $usadas = $tags | Where-Object { $_ -match $padrao } |
            ForEach-Object { [version]($_ -replace [regex]::Escape($prefixo), "") }

          $ultima = if ($usadas) { ($usadas | Sort-Object -Descending)[0] } else { $null }
          $proxima = if ($ultima) { "$($ultima.Major).$($ultima.Minor).$($ultima.Build + 1)" } else { "1.0.0" }

          if ($ultima) { Write-Host "Última publicada deste app: $prefixo$ultima" }
          else         { Write-Host "Este app ainda não tem release publicada." }

          if ($tags -contains $tag) {
            throw "A versão '$tag' JÁ FOI PUBLICADA. Uma release não se sobrescreve — o " +
                  "app instalado na clínica já baixou essa versão e não voltaria a baixá-la. " +
                  "Use a próxima livre: $prefixo$proxima"
          }

          # Versão menor que a última também não serve: o auto-update só anda para frente,
          # então a clínica instalaria e continuaria vendo a versão antiga.
          $v = [version]"${{ steps.alvo.outputs.version }}"
          if ($ultima -and $v -lt $ultima) {
            throw "A versão ${{ steps.alvo.outputs.version }} é ANTERIOR à última publicada " +
                  "($ultima). O auto-update só avança: a clínica não receberia nada. " +
                  "Use $prefixo$proxima ou maior."
          }

          Write-Host "OK — $tag está livre."

      - name: Instalar Velopack CLI (vpk)
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.0
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Publicar (pasta self-contained)
        run: dotnet publish ${{ steps.alvo.outputs.projeto }} -c Release -r win-x64 --self-contained true -p:Version=${{ steps.alvo.outputs.version }} -o publish

      # O faturamento fica no canal padrão (win) e por isso NÃO recebe --channel:
      # passá-lo mudaria o nome do feed e quebraria o auto-update já instalado.
      - name: Empacotar com Velopack
        shell: pwsh
        run: |
          $canal = "${{ steps.alvo.outputs.canal }}"
          $args = @(
            "pack",
            "--packId",      "${{ steps.alvo.outputs.packId }}",
            "--packVersion", "${{ steps.alvo.outputs.version }}",
            "--packDir",     "publish",
            "--mainExe",     "${{ steps.alvo.outputs.mainExe }}",
            "--packTitle",   "${{ steps.alvo.outputs.titulo }}"
          )
          if ($canal -ne "win") { $args += @("--channel", $canal) }
          & vpk @args
          if ($LASTEXITCODE -ne 0) { throw "vpk pack falhou" }

      - name: Publicar no GitHub Releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $canal = "${{ steps.alvo.outputs.canal }}"
          $args = @(
            "upload", "github",
            "--repoUrl",     "https://github.com/lucaszaous-creator/Clinica",
            "--publish",
            "--releaseName", "${{ steps.alvo.outputs.titulo }} ${{ steps.alvo.outputs.version }}",
            "--tag",         "${{ steps.alvo.outputs.tag }}",
            "--token",       "$env:GITHUB_TOKEN"
          )
          if ($canal -ne "win") { $args += @("--channel", $canal) }
          & vpk @args
          if ($LASTEXITCODE -ne 0) { throw "vpk upload falhou" }
