name: Videoaulas (Treinamento)

# Grava as videoaulas da aba Treinamento dos cinco apps (out/2026). Nada disto roda na máquina
# da clínica nem na de quem programa — é o GitHub que monta a navegação, sobe a prévia, grava e
# codifica os vídeos.
#
# A divisão dos jobs é a das plataformas:
#  - `navegacao` (Windows): monta os MESMOS módulos e o MESMO ShellViewModel dos executáveis
#    e grava o navegacao.json — menu do topo, abas e o componente de cada chave. Só o shell
#    WPF sabe isso; escrevê-lo à mão no roteiro seria uma segunda definição do menu.
#  - `inventario` e `gravar` (Linux, 1× na cota): sobem tools/PreviaBlazor com a navegação, e o
#    Playwright abre cada aula na página /aula (moldura real + tela real + dados fictícios das
#    sementes). O inventário fotografa as telas (para escrever roteiro); a gravação roda UMA
#    máquina por app, em paralelo, e o `juntar` monta o catálogo com os MP4 pelo SHA-256.
#
# Roda no PR que mexe na gravação, na prévia ou neste arquivo — não em todo PR: gravar ~80
# aulas custa minutos, e tela que mudou não invalida sozinha um vídeo (a aula é conferida
# quando o roteiro dela muda). Publicar os MP4 na release é passo à parte (README da pasta).

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/treinamento/**'
      - 'tools/PreviaBlazor/**'
      - '.github/workflows/treinamento.yml'
  workflow_dispatch:
    inputs:
      aulas:
        description: 'Chaves das aulas a gravar, separadas por vírgula (vazio = todas com roteiro)'
        required: false
        default: ''

concurrency:
  group: treinamento-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  navegacao:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Cache do NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Gravar a navegação real dos cinco apps
        shell: pwsh
        run: |
          dotnet run --project tools/treinamento/captura/CapturaTreinamento.csproj -c Release -- saida-navegacao
          if (Test-Path saida-navegacao/erro.txt) { Get-Content saida-navegacao/erro.txt; exit 1 }
          if (-not (Test-Path saida-navegacao/navegacao.json)) { Write-Error "navegacao.json não foi gravado"; exit 1 }
          $apps = Get-Content saida-navegacao/navegacao.json -Raw | ConvertFrom-Json
          foreach ($a in $apps) {
            if ($a.erro) { Write-Error "$($a.app): $($a.erro)"; exit 1 }
            Write-Host "$($a.app): $($a.itens.Count) itens, $($a.telasTreinamento.Count) telas no Treinamento"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: navegacao
          path: saida-navegacao/navegacao.json
          retention-days: 7

  # O inventário: foto e controles de cada tela, para escrever e conferir roteiro.
  inventario:
    needs: navegacao
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: navegacao
          path: navegacao
      - name: Preparar a gravação
        run: bash tools/treinamento/gravacao/preparar.sh navegacao/navegacao.json
      - name: Inventário das telas
        working-directory: tools/treinamento/gravacao
        run: node inventario.js http://127.0.0.1:5199 "$GITHUB_WORKSPACE/navegacao/navegacao.json" "$GITHUB_WORKSPACE/inventario"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventario
          path: inventario
          retention-days: 7

  # A gravação: uma máquina por app, em paralelo (Linux custa 1× na cota).
  gravar:
    needs: navegacao
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        app: [recepcao, consultorio, financeiro, faturamento, gerente]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: navegacao
          path: navegacao
      - name: Preparar a gravação
        run: bash tools/treinamento/gravacao/preparar.sh navegacao/navegacao.json
      - name: Gravar as aulas do app
        working-directory: tools/treinamento/gravacao
        env:
          APPS: ${{ matrix.app }}
          AULAS: ${{ github.event.inputs.aulas }}
        run: node gravar.js http://127.0.0.1:5199 "$GITHUB_WORKSPACE/navegacao/navegacao.json" "$GITHUB_WORKSPACE/aulas"
      - name: Log da prévia
        if: always()
        run: tail -n 150 previa.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parte-${{ matrix.app }}
          path: aulas
          retention-days: 7
          if-no-files-found: ignore

  # Um catálogo só, com os vídeos pelo SHA-256 — o que a release publica e o app baixa.
  juntar:
    needs: gravar
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          pattern: parte-*
          path: partes
      - name: Juntar o catálogo
        run: |
          mkdir -p partes
          node tools/treinamento/gravacao/juntar.js partes videoaulas
          if grep -q '"erro"' videoaulas/resumo.json; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videoaulas
          path: videoaulas
          retention-days: 14
