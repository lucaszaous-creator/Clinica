name: Build EXE (Windows)

# Compila o app WPF num runner Windows e publica o .exe como artefato para download.
#
# ⚠️ RODA NO PR, NÃO NO PUSH DA MAIN — e a razão é dinheiro (parcela 90). O runner
# Windows é faturado com multiplicador 2×: um build de ~6min30 custa ~13 minutos da
# cota. Com os dois gatilhos ligados, TODA mudança pagava esse preço DUAS VEZES —
# uma no PR e outra no push da main logo depois do merge — pelo MESMO código.
#
# E não é aproximadamente o mesmo código: num evento `pull_request` o GitHub faz
# checkout de `refs/pull/N/merge`, que é o merge do head na base. O que este job
# compila no PR é EXATAMENTE a árvore que a main vai ter. Rodar de novo depois do
# merge é recompilar o que já foi compilado.
#
# O que se perde: um push DIRETO na main (sem PR) não gera build. Aqui tudo entra
# por PR; para o caso raro, o `workflow_dispatch` roda em qualquer branch.
#
# ⚠️ TUDO EM PARALELO, desde out/2026 (eram ~15–18 min; a meta é ~7). Três jobs correm
# juntos: `testes` (Linux, em SEIS fatias de duração igual — o que não precisa de Windows, e
# Linux é faturado 1×), `conferencias` (testes e verificadores de tela no Windows) e
# `publicar` (os cinco .exe). O job `build` espera os três e responde por eles: é o NOME do
# check do PR, e renomeá-lo soltaria qualquer regra de proteção da main que o exija. O cache
# do NuGet corta a restauração em todos.
#
# ⚠️ O `.exe` de commit reprovado NÃO fica para download (pedido da direção) — e isso não exige
# mais esperar os testes para começar a gerar. O `publicar` roda junto; se `testes` ou
# `conferencias` reprovarem, o `build` APAGA os artefatos Clinica-* do run. É o desenho dos CIs
# grandes: o artefato de PR é de verificação (vive 7 dias), e quem distribui à clínica é a
# release (`release.yml`), que continua sendo uma decisão separada. Enquanto o run está no ar
# o `.exe` existe sem veredito — o check do PR, amarelo, diz isso; ninguém deve baixá-lo antes.
#
# ⚠️ É o ÚNICO CI de código desde out/2026: o `verificar.yml` (Linux, em todo push) saiu
# para economizar minutos de Actions. Postgres, tablet, web de leitura e compilação-sombra
# viraram rede LOCAL obrigatória antes do push (CLAUDE.md, seção 6).

on:
  pull_request:
    branches: [main]
    # Mudança só de documentação não pode quebrar compilação de XAML — e 13 minutos
    # de cota por uma vírgula no CLAUDE.md é o gasto mais fácil de cortar deste
    # repositório. `paths-ignore` só pula quando TODOS os arquivos batem: PR que
    # mistura código e documento roda normalmente.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Empurrar três correções seguidas para um PR aberto disparava três builds Windows
# completos, e só o último interessa. Aqui o novo cancela o anterior do MESMO PR.
concurrency:
  group: build-exe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ============================================================
  # O que não precisa de Windows: redes estáticas e a suíte geral.
  # ============================================================
  # ⚠️ EM SEIS FATIAS PARALELAS, divididas pelo TEMPO MEDIDO de cada teste (out/2026): a
  # suíte roda em série dentro do processo (AssemblyInfo.cs) e levaria ~21 min num job só.
  # Cada fatia é um processo próprio, então o estado estático não vaza entre elas; quem divide
  # é o `FatiaDaSuite` (tests/Clinica.Tests), pela variável CLINICA_FATIA e pela tabela
  # `tempos-dos-testes.json` — regrave-a com `tools/medir-tempos-dos-testes.py` quando uma
  # fatia passar a demorar visivelmente mais que as outras. Linux custa 1×: seis jobs de ~5 min
  # custam quase o mesmo que um de 21. O check `build` responde pelas seis.
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fatia: [1, 2, 3, 4, 5, 6]
    name: testes (${{ matrix.fatia }}/6)
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Cache do NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Conferir espelho dos tokens (CSS x XAML)
        if: matrix.fatia == 1
        run: python3 tokens/verificar-espelho.py

      - name: Conferir a suíte multi-exe (XAML, pack URIs, projetos)
        if: matrix.fatia == 1
        run: python3 tools/verificar-suite.py

      - name: Testes (fatia ${{ matrix.fatia }} de 6)
        env:
          CLINICA_FATIA: ${{ matrix.fatia }}/6
        run: dotnet test tests/Clinica.Tests/Clinica.Tests.csproj -c Release

  # ============================================================
  # Testes e verificadores que só rodam com o WPF de verdade.
  # ============================================================
  conferencias:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Cache do NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Testar carregamento e cache das telas Windows
        run: dotnet test tests/Clinica.Windows.Tests/Clinica.Windows.Tests.csproj -c Release

      - name: Conferir janelas responsivas com dados fictícios
        run: dotnet run --project tools/ValidarLayoutWindows -c Release

      - name: Conferir gestão, pagamentos e estoque no Windows
        run: dotnet run --project tools/ValidarLayoutWindows -c Release --no-build -- --gestao

      - name: Conferir recall, filtros e configuração salva no Windows
        run: dotnet run --project tools/ValidarLayoutWindows -c Release --no-build -- --acompanhamento

      # O flash preto das telas Blazor, medido na TELA DE VERDADE (out/2026): abre o shell
      # do Financeiro na tela, troca 160 vezes entre as 14 telas Blazor e as WPF, e fotografa
      # a área de trabalho em laço. Reprova com uma foto escura; e reprova também quando a
      # foto não enxerga o WebView2 — "zero flash" com a câmera cega seria garantia aparente.
      - name: Conferir que a troca de telas Blazor não pisca preto
        run: dotnet run --project tools/ValidarLayoutWindows -c Release --no-build -- --blazor

      - name: Guardar as fotos da troca de telas Blazor
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trocas-blazor
          path: artifacts/trocas-blazor/
          if-no-files-found: ignore

      - name: Conferir navegação dos cinco aplicativos e perfis
        run: dotnet run --project tools/Clinica.Verificacao.Desktop -c Release -- artifacts/navegacao-desktop

      - name: Conferir infusões, modelos e catálogo de medicamentos
        run: dotnet run --project tools/VerificarInfusao -c Release -- artifacts/infusao-desktop


  # ============================================================
  # Os cinco .exe portáteis (ver docs/arquitetura-multi-exe.md).
  # Estes projetos são net8.0-windows/WPF e NÃO compilam em Linux.
  # Rodam JUNTO com os testes (out/2026): esperar por eles somava ~5 min ao PR. O pedido da
  # direção continua valendo — artefato de commit reprovado não fica disponível —, e quem o
  # cumpre agora é o job `build`, que apaga os Clinica-* quando testes ou conferências reprovam.
  # ============================================================
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Cache do NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/Directory.*.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publicar .exe (self-contained, arquivo único)
        run: >
          dotnet publish src/Clinica.Desktop/Clinica.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableWindowsTargeting=true
          -o publish

      - name: Enviar artefato
        uses: actions/upload-artifact@v6
        with:
          name: Clinica-Faturamento-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 7

      - name: Publicar .exe da Recepção (self-contained, arquivo único)
        run: >
          dotnet publish src/Clinica.Recepcao/Clinica.Recepcao.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableWindowsTargeting=true
          -o publish-recepcao

      - name: Enviar artefato da Recepção
        uses: actions/upload-artifact@v6
        with:
          name: Clinica-Recepcao-win-x64
          path: publish-recepcao/
          if-no-files-found: error
          retention-days: 7

      - name: Publicar .exe do Consultório (self-contained, arquivo único)
        run: >
          dotnet publish src/Clinica.Clinico/Clinica.Clinico.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableWindowsTargeting=true
          -o publish-clinico

      - name: Enviar artefato do Consultório
        uses: actions/upload-artifact@v6
        with:
          name: Clinica-Consultorio-win-x64
          path: publish-clinico/
          if-no-files-found: error
          retention-days: 7

      - name: Publicar .exe do Financeiro (self-contained, arquivo único)
        run: >
          dotnet publish src/Clinica.Financeiro/Clinica.Financeiro.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableWindowsTargeting=true
          -o publish-financeiro

      - name: Enviar artefato do Financeiro
        uses: actions/upload-artifact@v6
        with:
          name: Clinica-Financeiro-win-x64
          path: publish-financeiro/
          if-no-files-found: error
          retention-days: 7

      - name: Publicar .exe do Gerente Geral (self-contained, arquivo único)
        run: >
          dotnet publish src/Clinica.Gerente/Clinica.Gerente.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableWindowsTargeting=true
          -o publish-gerente

      - name: Enviar artefato do Gerente Geral
        uses: actions/upload-artifact@v6
        with:
          name: Clinica-Gerente-win-x64
          path: publish-gerente/
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # O check `build` do PR: verde só quando os três ficaram verdes.
  # ============================================================
  build:
    runs-on: ubuntu-latest
    needs: [testes, conferencias, publicar]
    if: always()
    permissions:
      actions: write   # só para apagar os .exe de um commit reprovado
    steps:
      - name: Apagar os .exe de um commit reprovado
        if: needs.testes.result != 'success' || needs.conferencias.result != 'success' || needs.publicar.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # As fotos da troca de telas (trocas-blazor) ficam: são o diagnóstico da reprovação.
          gh api --paginate "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("Clinica-")) | "\(.id) \(.name)"' |
          while read -r id nome; do
            echo "apagando $nome"
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - name: Conferir os três jobs
        run: |
          echo "testes=${{ needs.testes.result }} conferencias=${{ needs.conferencias.result }} publicar=${{ needs.publicar.result }}"
          test "${{ needs.testes.result }}" = success
          test "${{ needs.conferencias.result }}" = success
          test "${{ needs.publicar.result }}" = success
