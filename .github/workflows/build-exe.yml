name: Build EXE (Windows)

# Compila o app WPF num runner Windows e publica o .exe como artefato para download.
#
# ⚠️ RODA NO PR, NÃO NO PUSH DA MAIN — e a razão é dinheiro (parcela 90). O runner
# Windows é faturado com multiplicador 2×: um build de ~6min30 custa ~13 minutos da
# cota. Com os dois gatilhos ligados, TODA mudança pagava esse preço DUAS VEZES —
# uma no PR e outra no push da main logo depois do merge — pelo MESMO código.
#
# E não é aproximadamente o mesmo código: num evento `pull_request` o GitHub faz
# checkout de `refs/pull/N/merge`, que é o merge do head na base. O que este job
# compila no PR é EXATAMENTE a árvore que a main vai ter. Rodar de novo depois do
# merge é recompilar o que já foi compilado.
#
# O que se perde: um push DIRETO na main (sem PR) não gera build. Aqui tudo entra
# por PR; para o caso raro, o `workflow_dispatch` roda em qualquer branch.
#
# ⚠️ Este job é um SUPERCONJUNTO do `verificar.yml`: ele roda o espelho de tokens, o
# `verificar-suite`, os testes E o compilador de marcação do WPF. Por isso o
# `verificar` não precisa disparar em PR — seria a terceira execução das mesmas
# três redes no mesmo commit.

on:
  pull_request:
    branches: [main]
    # Mudança só de documentação não pode quebrar compilação de XAML — e 13 minutos
    # de cota por uma vírgula no CLAUDE.md é o gasto mais fácil de cortar deste
    # repositório. `paths-ignore` só pula quando TODOS os arquivos batem: PR que
    # mistura código e documento roda normalmente.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Empurrar três correções seguidas para um PR aberto disparava três builds Windows
# completos, e só o último interessa. Aqui o novo cancela o anterior do MESMO PR.
concurrency:
  group: build-exe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Preparar Node para a interface financeira
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Compilar interface local da suíte e entrada
        working-directory: src/Clinica.Desktop.Shell/Web/frontend
        run: |
          npm ci
          npm run build

      - name: Compilar a interface financeira local
        working-directory: src/Clinica.Modulo.Financeiro/Web/frontend
        run: |
          npm ci
          npm run build

      - name: Validar contratos de páginas e diálogos da suíte
        run: dotnet run --project tools/validar-suite-web/Qa.csproj -c Release

      - name: Conferir espelho dos tokens (CSS x XAML)
        run: python tokens/verificar-espelho.py

      - name: Conferir a suíte multi-exe (XAML, pack URIs, projetos)
        run: python tools/verificar-suite.py

      - name: Restaurar
        run: dotnet restore Clinica.sln

      - name: Testes (regras de faturamento)
        run: dotnet test tests/Clinica.Tests/Clinica.Tests.csproj -c Release

      - name: Conferir janelas responsivas com dados fictícios
        run: dotnet run --project tools/ValidarLayoutWindows -c Release

      - name: Conferir gestão, pagamentos e estoque no Windows
        run: dotnet run --project tools/ValidarLayoutWindows -c Release -- --gestao

      - name: Conferir Financeiro, formulários e séries com dados fictícios
        run: dotnet run --project tools/validar-design-financeiro -c Release

      - name: Preparar WebView2 para a validação financeira
        shell: pwsh
        run: |
          $chaves = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $instalado = $chaves | ForEach-Object { (Get-ItemProperty -LiteralPath $_ -ErrorAction SilentlyContinue).pv } |
            Where-Object { $_ -and $_ -ne '0.0.0.0' }
          if (-not $instalado) {
            $instaladorWebView = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $instaladorWebView
            $assinatura = Get-AuthenticodeSignature -LiteralPath $instaladorWebView
            if ($assinatura.Status -ne 'Valid' -or $assinatura.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw 'Assinatura do instalador WebView2 inválida.'
            }
            $processoWebView = Start-Process -FilePath $instaladorWebView -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($processoWebView.ExitCode -ne 0) { throw "Instalação WebView2 falhou: $($processoWebView.ExitCode)" }
          }

      - name: Conferir todas as páginas e operações do Financeiro no WebView2
        run: dotnet run --project tools/validar-design-financeiro -c Release -- --web

      - name: Conferir ficha, sessões, exames e impressão no WebView2
        run: dotnet run --project tests/Clinica.Clinico.Web.Qa -c Release -- --web

      - name: Conferir buscas e filtros da agenda no WebView2
        run: dotnet run --project qa/recepcao-web -c Release -- --buscas

      - name: Conferir recall, filtros e configuração salva no Windows
        run: dotnet run --project tools/ValidarLayoutWindows -c Release -- --acompanhamento

      - name: Conferir navegação dos cinco aplicativos e perfis
        run: dotnet run --project tools/Clinica.Verificacao.Desktop -c Release -- artifacts/navegacao-desktop

      - name: Conferir infusões, modelos e catálogo de medicamentos
        run: dotnet run --project tools/VerificarInfusao -c Release -- artifacts/infusao-desktop

      - name: Conferir atendimento, histórico e gravação no Windows
        run: dotnet run --project tools/ValidarAtendimentoDesktop -c Release -- artifacts/atendimento-desktop

      - name: Publicar .exe (self-contained, arquivo único)
        run: >
          dotnet publish src/Clinica.Desktop/Clinica.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableWindowsTargeting=true
          -o publish

      - name: Conferir recursos web do Faturamento publicado
        run: ./tools/verificar-recursos-web-publicados.ps1 -Pasta publish

      - name: Enviar artefato
        uses: actions/upload-artifact@v6
        with:
          name: Clinica-Faturamento-win-x64
          path: publish/
          if-no-files-found: error

      # ============================================================
      # Suíte multi-exe (ver docs/arquitetura-multi-exe.md).
      # Estes projetos são net8.0-windows/WPF e NÃO compilam em Linux —
      # este runner Windows é a única validação que eles têm.
      # ============================================================
      - name: Publicar .exe da Recepção (self-contained, arquivo único)
        run: >
          dotnet publish src/Clinica.Recepcao/Clinica.Recepcao.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableWindowsTargeting=true
          -o publish-recepcao

      - name: Conferir recursos web da Recepção publicada
        run: ./tools/verificar-recursos-web-publicados.ps1 -Pasta publish-recepcao

      - name: Enviar artefato da Recepção
        uses: actions/upload-artifact@v6
        with:
          name: Clinica-Recepcao-win-x64
          path: publish-recepcao/
          if-no-files-found: error

      - name: Publicar .exe do Consultório (self-contained, arquivo único)
        run: >
          dotnet publish src/Clinica.Clinico/Clinica.Clinico.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableWindowsTargeting=true
          -o publish-clinico

      - name: Conferir recursos web do Consultório publicado
        run: ./tools/verificar-recursos-web-publicados.ps1 -Pasta publish-clinico

      - name: Enviar artefato do Consultório
        uses: actions/upload-artifact@v6
        with:
          name: Clinica-Consultorio-win-x64
          path: publish-clinico/
          if-no-files-found: error

      - name: Publicar .exe do Financeiro (self-contained, arquivo único)
        run: >
          dotnet publish src/Clinica.Financeiro/Clinica.Financeiro.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableWindowsTargeting=true
          -o publish-financeiro

      - name: Conferir recursos web do Financeiro publicado
        run: ./tools/verificar-recursos-web-publicados.ps1 -Pasta publish-financeiro

      - name: Enviar artefato do Financeiro
        uses: actions/upload-artifact@v6
        with:
          name: Clinica-Financeiro-win-x64
          path: publish-financeiro/
          if-no-files-found: error

      - name: Publicar .exe do Gerente Geral (self-contained, arquivo único)
        run: >
          dotnet publish src/Clinica.Gerente/Clinica.Gerente.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableWindowsTargeting=true
          -o publish-gerente

      - name: Conferir recursos web do Gerente publicado
        run: ./tools/verificar-recursos-web-publicados.ps1 -Pasta publish-gerente

      - name: Enviar artefato do Gerente Geral
        uses: actions/upload-artifact@v6
        with:
          name: Clinica-Gerente-win-x64
          path: publish-gerente/
          if-no-files-found: error
