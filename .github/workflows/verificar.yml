name: Verificar (Linux)

# Rede rápida, em TODA branch.
#
# O `build-exe.yml` roda num runner Windows e só dispara no PR para a main —
# commit em branch de trabalho não gera build nenhum, e o autor só descobriria um
# erro ao abrir o PR. Este job roda em Linux, em qualquer branch, e fecha três das
# quatro redes do projeto em poucos minutos:
#
#   1. tokens/verificar-espelho.py  — CSS x XAML
#   2. tools/verificar-suite.py     — XAML, pack URIs, chaves do design system
#   3. tools/compilar-sombra.py     — o C# dos sete projetos WPF
#   4. dotnet test                  — Domain, Application, Infrastructure
#
# A quarta rede (compilador de marcação do WPF e empacotamento dos quatro .exe)
# continua sendo do runner Windows: ela precisa do SDK WindowsDesktop, que não
# existe em Linux. Este job NÃO o substitui — ele antecipa o que dá para antecipar.

# ⚠️ SEM `pull_request` — e isso NÃO é economia às cegas (parcela 90). O
# `build-exe.yml` roda no PR e é um SUPERCONJUNTO deste job: ele executa as mesmas
# três redes e ainda compila o XAML de verdade. Com o gatilho de PR ligado, cada
# commit era conferido TRÊS vezes — no push da branch, no PR, e no push da main
# depois do merge. Agora cada commit é conferido uma vez em cada máquina que tem
# algo novo a dizer sobre ele.
#
# O push na main FICA: é a rede que sobra caso a main ande entre o PR ficar verde e
# o merge acontecer — barata (Linux é 1×) e é o único sinal que a main tem, já que o
# build Windows passou a rodar só no PR.

on:
  push:
  workflow_dispatch:

# Empurrar vários commits seguidos para a mesma branch cancela a conferência
# anterior: só o topo interessa.
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Conferir espelho dos tokens (CSS x XAML)
        run: python3 tokens/verificar-espelho.py

      - name: Conferir a suíte multi-exe (XAML, pack URIs, projetos)
        run: python3 tools/verificar-suite.py

      - name: Testes
        run: dotnet test tests/Clinica.Tests/Clinica.Tests.csproj -c Release

      # Por último: é o passo mais lento (baixa as reference assemblies do WPF do
      # NuGet) e o que menos costuma falhar sozinho depois dos anteriores.
      - name: Compilar o C# das telas WPF (compilação-sombra)
        run: python3 tools/compilar-sombra.py
