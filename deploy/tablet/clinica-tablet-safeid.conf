# Drop-in do portal para o SafeID: /etc/systemd/system/clinica-tablet.service.d/safeid.conf
# Sem ele o portal continua só com A1 (Portal__SafeId__Habilitado ausente = desligado).
# As credenciais ficam fora do portal.env para o atualizador copiar este sem levar o segredo.
[Unit]
After=clinica-safeid.service
Wants=clinica-safeid.service

[Service]
EnvironmentFile=/etc/clinica-tablet/safeid.env
