<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'"><title>Clínica SemDor</title><link rel="stylesheet" href="entrada.css"></head>
<body><main class="entrada"><aside><img src="logo-clinica.png" alt="Clínica SemDor"><div class="introducao"><span class="marca">CLÍNICA SEMDOR</span><h1>Cuidado em cada<br>detalhe.</h1><p>Seu espaço de trabalho, com as informações e ferramentas da clínica sempre à mão.</p></div><span class="rodape">Acesso exclusivo da equipe</span></aside><section class="conteudo"><header><span id="app" class="etiqueta"></span><h2 id="titulo">Bem-vindo</h2><p id="descricao"></p></header><form id="form" autocomplete="off"><label id="grupo-nome" hidden>Nome completo<input id="nome" name="nome" maxlength="120" autocomplete="off"></label><label id="grupo-login">Usuário<input id="login" name="login" maxlength="120" autocomplete="off" autocapitalize="none" spellcheck="false"></label><label id="grupo-senha">Senha<span class="senha"><input id="senha" name="senha" type="password" maxlength="4096" autocomplete="off"><button id="mostrar" type="button" aria-label="Mostrar senha" aria-pressed="false">Mostrar</button></span></label><label id="grupo-repetida" hidden>Repita a nova senha<input id="repetida" name="repetida" type="password" maxlength="4096" autocomplete="off"></label><label id="grupo-conexao" hidden>Conexão com o banco<textarea id="conexao" name="conexao" rows="4" maxlength="8192" autocomplete="off" spellcheck="false" placeholder="Cole a URL da Neon ou a conexão PostgreSQL"></textarea><span class="ajuda">A conexão é testada antes de ser salva com proteção neste computador.</span></label><div id="mensagem" role="status" aria-live="polite" hidden></div><div class="acoes"><button id="confirmar" class="primario" type="submit">Entrar</button><button id="salvar" class="primario" type="button" hidden>Salvar e continuar</button><button id="cancelar" class="secundario" type="button">Sair</button></div></form><p class="ajuda" id="rodape">Suas permissões são definidas pela direção da clínica.</p></section></main><script src="entrada.js"></script></body></html>
